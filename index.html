<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedro · O Contador da Harvest</title>
<meta name="description" content="Pedro · O Contador da Harvest: controle de adiantamentos, despesas e prestação de contas do projeto Harvest.">
<meta name="theme-color" content="#0B3B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{--bg:#F2F6F3;--card:#fff;--card2:#F6FAF7;--ink:#13261E;--muted:#5D7268;--line:#E0EAE4;--inp:#fff;--chip:#E9F3EE;--pri:#0F8A5F;--pri2:#17A673;--gold:#E0A526;--red:#D15C66;--amber:#E08A1E;--blue:#2F6FD6;--mint:#E2F5EC;--shadow:0 1px 2px rgba(19,38,30,.04),0 10px 28px rgba(19,38,30,.07);--side:linear-gradient(180deg,#0C3A2C,#082419);--hero:linear-gradient(125deg,#0B5E43 0%,#0F8A5F 55%,#3DBE88 125%)}
body.dark{--bg:#07150F;--card:#0F2219;--card2:#13291F;--ink:#E5F1EA;--muted:#93ADA0;--line:#1E3A2D;--inp:#0B1C14;--chip:#173326;--mint:#123A2A;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3);--side:linear-gradient(180deg,#092A1F,#04120C);--hero:linear-gradient(125deg,#08432F,#0B6B49 60%,#139267 130%)}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(15,138,95,.35);outline-offset:2px}
.shell{display:flex;min-height:100vh}
.sidebar{width:252px;flex:none;background:var(--side);color:#D6E8DE;padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{padding:0 6px;display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.brand strong{display:block;font-size:20px;color:#fff;letter-spacing:-.5px;line-height:1.05}.brand small{display:block;color:#F2C24E;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#AFC9BB;text-align:left;padding:11px 14px;border-radius:12px;font-weight:650;display:flex;align-items:center;gap:10px;transition:.15s}
.nav .ico{width:22px;text-align:center;font-size:16px}.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:#fff;color:#0B5E43;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.sidebottom{margin-top:auto;display:grid;gap:10px}
.who{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:12px;color:#AFC9BB}.who b{display:block;color:#fff;font-size:13.5px}
.themebox{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:13px;color:#DCEBE3}
.sw{width:42px;height:24px;border-radius:20px;background:rgba(255,255,255,.25);border:0;position:relative;transition:.2s;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
body.dark .sw{background:var(--pri2)}body.dark .sw:after{left:21px}
.main{flex:1;min-width:0;padding:26px clamp(16px,3vw,44px) 70px;max-width:1400px;margin:auto;width:100%}
.mtop{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{color:var(--pri);font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(24px,3vw,32px);line-height:1.12;letter-spacing:-1px;margin:4px 0}h2{font-size:16px;letter-spacing:-.3px;margin:0}h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:0}
.actions,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 15px;font-weight:700;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--pri);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#17A673,#0B6E4A);color:#fff;border:0;box-shadow:0 6px 18px rgba(15,138,95,.3)}
.btn.gold{background:linear-gradient(135deg,#F2C24E,#D99A1C);color:#3A2800;border:0}
.btn.danger{color:var(--red)}.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.light{background:#fff;color:#0B5E43;border:0}.btn.glass{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.field{display:grid;gap:6px;align-content:start}.field label{font-size:12px;font-weight:750;color:var(--muted)}
.field input,.field select,.field textarea,.filters select,.filters input{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);min-width:0;outline:none;transition:.15s;width:100%}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus,.filters select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,138,95,.15)}
.field input[readonly]{background:var(--chip);font-weight:700}
label.chk{display:flex!important;align-items:center;gap:8px;font-size:13px!important;color:var(--ink)!important;font-weight:600!important;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--pri)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}.filters select,.filters input{width:auto}.filters input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:4px;gap:2px}.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card{padding:16px 18px;min-height:112px}.card .kico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.card .label{font-size:12px;color:var(--muted);font-weight:700}.card .value{font-size:clamp(19px,2vw,24px);font-weight:800;letter-spacing:-.6px;margin:2px 0;font-variant-numeric:tabular-nums}.card .hint{font-size:11.5px;color:var(--muted)}
.panel{padding:20px;margin-bottom:16px;min-width:0}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.panelhead p{color:var(--muted);font-size:12px;margin:3px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.grid2>.panel{margin-bottom:0}
.legend{display:grid;gap:11px}.legendrow{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:5px;align-items:center}.legendrow .track{grid-column:1/-1}.legendrow strong{font-size:12.5px}.legendrow span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:12px;background:var(--chip);overflow:hidden}.fill{height:100%;border-radius:12px;background:var(--pri);transition:width .5s ease}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;background:var(--chip);color:var(--muted);padding:3px 9px;font-size:11px;font-weight:750;white-space:nowrap}
.pill.ok{background:rgba(15,138,95,.13);color:#0A7350}.pill.wait{background:rgba(224,138,30,.15);color:#9A5A0B}.pill.red{background:rgba(209,92,102,.14);color:#B13D4A}
body.dark .pill.ok{color:#6FE0B0}body.dark .pill.wait{color:#F5C07A}body.dark .pill.red{color:#F09AA2}
.code{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;background:var(--chip);color:var(--pri);padding:2px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
body.dark .code{color:#6FE0B0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:14px}
.muted{color:var(--muted)}.help{font-size:12px;color:var(--muted)}
.notice{padding:12px 15px;border-radius:12px;background:var(--mint);color:#0F5E42;font-size:12.5px;margin-bottom:14px}body.dark .notice{color:#8FE3BE}
.notice.warn{background:rgba(224,138,30,.14);color:#86500C}body.dark .notice.warn{color:#F5C07A}
.notice.err{background:rgba(209,92,102,.13);color:#A3303D}body.dark .notice.err{color:#F09AA2}
.list{display:grid;gap:8px}
.listitem{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.listitem small{display:block;color:var(--muted)}
.exp{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px 13px;transition:.15s}
.exp:hover{border-color:rgba(15,138,95,.45)}
.exp .eico{width:42px;height:42px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px}
.exp .et{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exp small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.exp .eamt{text-align:right;display:grid;gap:4px;justify-items:end}.exp .eamt strong{font-size:15px;font-variant-numeric:tabular-nums}
.exp .eact{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--card2);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:14px;transition:.12s}.ib:hover{border-color:var(--pri)}.ib.ok{background:var(--pri);color:#fff;border-color:var(--pri)}.ib.danger:hover{border-color:var(--red)}
.dhead{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 6px}.dhead:first-child{margin-top:0}
.modalback{position:fixed;inset:0;background:rgba(4,14,9,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.modalback.show{display:flex}
.modal{background:var(--card);border-radius:24px;width:min(640px,100%);max-height:94vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.modalhead h2{font-size:19px}.modalhead button{border:0;background:var(--chip);border-radius:10px;width:36px;height:36px;font-size:20px;color:var(--muted);flex:none}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.formfooter{display:flex;justify-content:flex-end;gap:9px;margin-top:6px;flex-wrap:wrap}
.bigamount{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.bigamount span{font-size:20px;font-weight:800;color:var(--muted)}.bigamount input{border:0!important;background:transparent!important;font-size:28px!important;font-weight:800;padding:4px 0!important;width:100%;box-shadow:none!important;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:650;color:var(--ink);transition:.12s}
.chips button:hover{border-color:var(--pri)}.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(15,138,95,.28)}
.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{border:0;background:var(--chip);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:650}.quick button:hover{background:var(--pri);color:#fff}
.catinfo{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;display:grid;gap:6px}
.catinfo .ci{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.catinfo p{margin:0;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;background:#0B2A1E;color:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:none;font-weight:600;max-width:min(560px,92vw);text-align:center}.toast.show{display:block;animation:pop .2s}
.section{display:none}.section.active{display:block;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:24px 28px;display:grid;grid-template-columns:1.35fr 1fr;gap:24px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(11,94,67,.28)}
.hero.alert{background:linear-gradient(125deg,#7A4C05 0%,#C98A12 55%,#EDBE4A 125%);box-shadow:0 14px 40px rgba(160,105,10,.3)}
.hero.neg{background:linear-gradient(125deg,#6E1E29 0%,#B2404D 60%,#DA7380 130%)}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero .htag{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.hero .msg{opacity:.96;margin-top:8px;max-width:560px;font-size:14px}
.hero .side{background:rgba(255,255,255,.13);border-radius:18px;padding:16px 18px;display:grid;gap:8px;align-content:center}
.hero .side .l{font-size:12px;opacity:.88}.hero .side .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.hbar{height:14px;border-radius:10px;background:rgba(255,255,255,.22);position:relative;overflow:visible}.hbar i{display:block;height:100%;border-radius:10px;background:#fff;max-width:100%;position:absolute;left:0;top:0}.hbar i.lan{background:rgba(255,255,255,.5)}
.hleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;opacity:.95}.hleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:#fff}.hleg i.lan{background:rgba(255,255,255,.5)}
.hero .hsub{font-size:12.5px;opacity:.88;margin-top:4px;font-variant-numeric:tabular-nums}
.hbar b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:#FFD866;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.prog{height:12px;border-radius:10px;background:var(--chip);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#17A673,#0F8A5F);border-radius:10px}
.gcat{margin-bottom:18px}.gcat h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px 4px}
.gitem{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.gitem .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.gitem p{margin:0;font-size:12.5px;color:var(--muted)}.gitem p b{color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.editbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:rgba(224,165,38,.14);border:1px solid rgba(224,165,38,.4);margin-bottom:14px;font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:13.5px}.kv span{color:var(--muted)}
.blist{display:grid;gap:6px;max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.bitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;font-size:12.5px;cursor:pointer}.bitem:hover{background:var(--card2)}.bitem input{width:17px;height:17px;accent-color:var(--pri)}
.bnav,.fab{display:none}
.pie{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.hole{width:58%;height:58%;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hole b{font-size:17px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}.hole small{font-size:11px;color:var(--muted)}
.plegend{display:grid;gap:7px}.pl{display:grid;grid-template-columns:12px 1fr auto;gap:2px 9px;align-items:center;font-size:12.5px}
.pl i{width:12px;height:12px;border-radius:4px}.pl span{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl b{font-variant-numeric:tabular-nums}.pl small{grid-column:2/-1;color:var(--muted);font-size:11.5px;margin-top:-3px}
.argobox{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--card2);border:1.5px dashed rgba(15,138,95,.45);border-radius:12px;padding:12px 14px;word-break:break-word;line-height:1.5;user-select:all}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.hero{grid-template-columns:1fr}.ggrid{grid-template-columns:1fr}}
@media(max-width:760px){
 .pie{grid-template-columns:1fr;justify-items:center}.ring{width:175px;height:175px}.plegend{width:100%}
 .sidebar{display:none}.main{padding:0 14px calc(96px + env(safe-area-inset-bottom))}
 .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 2px 10px;margin-bottom:6px}
 .mtop .brand{padding:0}.mtop .brand img{width:36px;height:36px;border-radius:10px}.mtop .brand strong{font-size:16px;color:var(--ink)}.mtop .brand small{color:var(--gold)}
 .top{margin-bottom:12px}.top .actions{display:none}
 .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
 .bnav button{border:0;background:transparent;display:grid;justify-items:center;gap:1px;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0}.bnav button span{font-size:19px;line-height:1.2}.bnav button.active{color:var(--pri)}
 .bnav .plus span{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#17A673,#0B6E4A);color:#fff;display:grid;place-items:center;font-size:26px;margin-top:-20px;box-shadow:0 8px 20px rgba(15,138,95,.4)}
 .cards{gap:10px;margin:12px 0}.card{padding:13px 14px;min-height:0}.card .kico{width:30px;height:30px;font-size:15px;margin-bottom:5px}
 .hero{padding:20px;gap:16px;border-radius:20px}.hero .big{font-size:34px}
 .formgrid{grid-template-columns:1fr}.full{grid-column:auto}
 .modalback{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
 .exp{grid-template-columns:38px 1fr auto;gap:10px;padding:10px 11px}.exp .eico{width:38px;height:38px;font-size:17px}
 .exp .eact{grid-column:1/-1;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:8px}
 .kv{grid-template-columns:1fr;gap:2px}.kv span{margin-top:8px}
 .filters .seg{width:100%;justify-content:space-between}.filters .seg button{flex:1}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><img src="./icons/icon.svg" alt=""><div><strong>Pedro</strong><small>O Contador da Harvest</small></div></div>
 <nav class="nav" aria-label="Navegação">
  <button class="active" data-page="home"><span class="ico">🏠</span>Início</button>

const HMAP={date:h=>h.startsWith('data')&&!h.includes('prest'),city:h=>h.startsWith('cidade'),code:h=>h.includes('codigo harvest'),cat:h=>h.startsWith('categoria'),meal:h=>h.startsWith('refeicao'),qty:h=>h.includes('noites')||h.includes('diarias')||h.startsWith('quantidade'),people:h=>h.includes('pessoas'),plate:h=>h.startsWith('placa'),amount:h=>h.startsWith('valor'),holiday:h=>h.startsWith('feriado'),ben:h=>h.startsWith('beneficiario'),note:h=>h.startsWith('detalhamento')||h.startsWith('observ'),argo:h=>h.includes('argo')&&h.includes('lanc'),done:h=>h.startsWith('prestada')||h==='status',rid:h=>h.includes('prestacao')&&/^n/.test(h)};
const yes=v=>['sim','s','x','yes','y','true','1','prestada','lancada','ok'].includes(norm(v));
function cellDate(v){if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}

 m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m&&isDate(m[0])?m[0]:null}
const cellAmt=v=>typeof v==='number'?(v>0&&v<1e9?Math.round(v*100):null):parseAmt(v);
const cellInt=v=>{const n=typeof v==='number'?Math.round(v):parseInt(String(v||'').trim(),10);return n>0?n:0};
function matchCat(v){const s=String(v||'').trim();if(!s)return null;const m=s.toUpperCase().match(/HV[A-Z0-9]{4,}/);if(m){const c=db.categories.find(c=>c.code.toUpperCase()===m[0]||String(c.argoCode).toUpperCase()===m[0]);if(c)return c}
 const n=norm(s.replace(/^HV[A-Z0-9]+\s*-\s*/i,''));return db.categories.find(c=>norm(c.name)===n)||db.categories.find(c=>norm(c.group+' '+c.name)===n)||null}
function prepareImport(rows){const hi=rows.findIndex(r=>r.cells.some(v=>norm(v).startsWith('data'))&&r.cells.some(v=>norm(v).startsWith('valor')));
 if(hi<0)throw Error('não encontrei a linha de títulos (Data, Cidade, Categoria, Valor…). Use o template do Pedro.');
 const H=rows[hi].cells.map(norm),col={};for(const [k,f] of Object.entries(HMAP)){const i=H.findIndex(h=>h&&f(h));if(i>=0)col[k]=i}
 if(col.code!=null)col.cat=col.code;const miss=['date','city','cat','amount'].filter(k=>col[k]==null);if(miss.length)throw Error('faltam colunas obrigatórias: '+miss.map(k=>({date:'Data',city:'Cidade',cat:'Categoria',amount:'Valor'})[k]).join(', '));
 const ok=[],errors=[],warn=[];let dup=0;const key=e=>[e.date,e.categoryId,e.amount,norm(e.beneficiary),e.meal||'',e.qty||''].join('|'),seen=new Set(db.expenses.map(key));

 for(const r of body){const g=k=>col[k]==null?'':r.cells[col[k]]??'',c=matchCat(g('cat')),P=[];
  const date=cellDate(g('date'));if(!date)P.push('data inválida');if(!c)P.push(String(g('cat')).trim()?'categoria não encontrada: '+String(g('cat')).slice(0,40):'categoria vazia');
  if(P.length){errors.push({n:r.n,m:P.join('; ')});continue}
  const qr=qtyRule(c),qty=qr?(cellInt(g('qty'))||1):undefined;let amount=cellAmt(g('amount'));
  if(c.rule==='perdiem'&&c.limit&&c.mode!=='none'&&!amount)amount=c.limit*qty;
  const done=yes(g('done')),x={id:'',categoryId:c.id,date,city:String(g('city')).trim(),qty,meal:c.rule==='meal'?(norm(g('meal')).startsWith('alm')?'Almoço':'Jantar'):undefined,holiday:yes(g('holiday')),amount,beneficiary:String(g('ben')).trim()||db.profile.name,note:String(g('note')).trim(),plate:String(g('plate')).trim().toUpperCase(),people:cellInt(g('people'))||undefined,status:done?'prestada':'pendente',reportId:done?String(g('rid')).trim():'',reportDate:done?TODAY():'',argo:yes(g('argo'))};
  if(String(g('amount')).trim()!==''&&!amount&&c.rule!=='perdiem'){errors.push({n:r.n,m:'valor inválido'});continue}
  const {E,W}=check(x);if(E.length){errors.push({n:r.n,m:E[0].replace('marque “É feriado”','preencha Feriado? = Sim')});continue}
  const k=key(x);if(seen.has(k)){dup++;continue}seen.add(k);if(W.length)warn.push({n:r.n,m:W[0]});ok.push(x)}

async function importSheet(file){try{if(file.size>10*1024*1024)throw Error('arquivo acima de 10 MB');const nm=file.name.toLowerCase();let rows;
  if(nm.endsWith('.xlsx')||nm.endsWith('.xlsm'))rows=await readXlsx(await file.arrayBuffer());else if(nm.endsWith('.csv')||nm.endsWith('.txt'))rows=readCsvRows(await file.text());else if(nm.endsWith('.xls'))throw Error('formato .xls antigo: no Excel use Salvar como → Pasta de Trabalho (.xlsx)');else throw Error('envie um arquivo .xlsx ou .csv');
  const R=prepareImport(rows),tot=sum(R.ok);
  const f=openModal('Importar despesas da planilha',`<form><p class="help" style="margin-top:0">Arquivo: <b>${esc(file.name)}</b> · ${R.total} linha(s) preenchida(s). Nada é gravado até você confirmar.</p>
  <div class="cards" style="grid-template-columns:repeat(3,1fr);margin:10px 0">${card('Prontas',String(R.ok.length),money(tot),'✅','#0A7350')}${card('Com erro',String(R.errors.length),'Serão ignoradas','⛔','#D15C66')}${card('Duplicadas',String(R.dup),'Já existem','♻️','#835FBD')}</div>
  ${R.errors.length?`<div class="notice err"><b>Linhas com erro (corrija na planilha e importe de novo):</b><br>${R.errors.slice(0,15).map(e=>`Linha ${e.n}: ${esc(e.m)}`).join('<br>')}${R.errors.length>15?`<br>… e mais ${R.errors.length-15}.`:''}</div>`:''}
  ${R.warn.length?`<div class="notice warn"><b>Avisos (serão importadas):</b><br>${R.warn.slice(0,8).map(e=>`Linha ${e.n}: ${esc(e.m)}`).join('<br>')}${R.warn.length>8?`<br>… e mais ${R.warn.length-8}.`:''}</div>`:''}
  ${R.ok.length?`<div class="blist" style="max-height:30vh">${R.ok.slice(0,40).map(e=>`<div class="bitem" style="grid-template-columns:1fr auto;cursor:default"><span>${dateFmt(e.date)} · ${icon(cat(e.categoryId))} ${esc(cat(e.categoryId).name)} · ${esc(e.city)}</span><b>${money(e.amount)}</b></div>`).join('')}${R.ok.length>40?`<div class="help" style="padding:6px 8px">… e mais ${R.ok.length-40}.</div>`:''}</div>`:''}
  <div class="formfooter" style="margin-top:14px"><button class="btn" type="button" data-act="cancel">Cancelar</button><button class="btn primary" type="submit" ${R.ok.length?'':'disabled'}>⬆ Importar ${R.ok.length} despesa(s)</button></div></form>`,()=>{
   if(!R.ok.length)return;const now=new Date().toISOString(),add=R.ok.map(x=>({...x,id:uid(),createdAt:now})),old=db.expenses;db.expenses=[...db.expenses,...add];if(!persist()){db.expenses=old;return}
   closeModal(true);navigate('home');toast(`${add.length} despesa(s) importada(s) · ${money(sum(add))} ✓`,5000)})}
 catch(err){toast('Não foi possível importar: '+err.message,6000)}}

 <div class="panel"><div class="filters"><div class="seg">${[['pend',`A lançar (${nP})`],['done','Lançadas'],['all','Todas']].map(([v,t])=>`<button data-af="${v}" class="${AF===v?'on':''}">${t}</button>`).join('')}</div>${l.length?'<button class="btn small" data-act="copyAll">📋 Copiar todas as listadas</button>':''}</div>
 ${l.length?`<div class="list">${l.map(e=>{const c=cat(e.categoryId)||{},t=argoDesc(e);return `<div class="gitem"><div class="gh"><span><strong>${icon(c)} ${esc(c.name||'Categoria removida')}</strong> <span class="code">${esc(c.argoCode||'')}</span><small class="muted" style="display:block">${dateFmt(e.date)} · ${esc(e.city)} · Tipo Argo: ${esc(c.argoType||'—')}</small></span><strong>${money(e.amount)}</strong></div>
 <div class="argobox">${esc(t)}</div><div class="row" style="justify-content:flex-end"><span class="pill ${e.argo?'ok':'wait'}" style="margin-right:auto">${e.argo?'✓ Lançada no Argo':'⏳ Não lançada'}</span><button class="btn small" data-act="editExp" data-id="${esc(e.id)}">✎ Editar</button><button class="btn small" data-act="copyTxt" data-txt="${esc(t)}">📋 Copiar</button><button class="btn small ${e.argo?'':'primary'}" data-act="argoMark" data-id="${esc(e.id)}">${e.argo?'Desfazer':'✓ Lançada'}</button></div></div>`}).join('')}</div>`:`<div class="empty">${db.expenses.length?(AF==='pend'?'Todas as despesas já foram lançadas no Argo. 🎉':'Nada neste filtro.'):'Nenhuma despesa lançada ainda.'}</div>`}</div>`}

/* ---------- prestação em lote ---------- */
function batchForm(){const pend=db.expenses.filter(e=>e.status!=='prestada').sort((a,b)=>a.date.localeCompare(b.date));if(!pend.length)return toast('Nenhuma despesa pendente de prestação.');
 const f=openModal('Prestar conta das despesas',`<form class="formgrid"><p class="help full" style="margin:0">Marque as despesas que entraram na prestação de contas enviada no Argo.</p>
 <div class="field"><label>Nº / identificação da prestação (opcional)</label><input name="reportId" maxlength="40" placeholder="Ex.: PC-1234"></div><div class="field"><label>Data de envio</label><input type="date" name="reportDate" value="${TODAY()}"></div>
 <label class="chk full"><input type="checkbox" id="chkAll" checked> Selecionar todas (${pend.length})</label>
 <div class="blist full">${pend.map(e=>`<label class="bitem"><input type="checkbox" name="ids" value="${esc(e.id)}" checked><span>${dateFmt(e.date)} · ${icon(cat(e.categoryId))} ${esc(cat(e.categoryId)?.name||'—')} · ${esc(e.city)}</span><b>${money(e.amount)}</b></label>`).join('')}</div>
 <div class="full help" id="bTot"></div>${footer('✓ Marcar como prestadas')}</form>`,form=>{const ids=new FormData(form).getAll('ids');if(!ids.length)return toast('Selecione ao menos uma despesa.');
  const rid=form.reportId.value.trim(),rd=isDate(form.reportDate.value)?form.reportDate.value:TODAY();db.expenses.forEach(e=>{if(ids.includes(e.id)){e.status='prestada';e.reportId=rid;e.reportDate=rd}});
  if(!persist())return;closeModal(true);render();toast(`${ids.length} despesa(s) marcada(s) como prestada(s) ✓`)});
 const upd=()=>{const ids=new FormData(f).getAll('ids'),v=sum(pend.filter(e=>ids.includes(e.id)));$('#bTot').innerHTML=`<b>${ids.length}</b> selecionada(s) · <b>${money(v)}</b>`;$('#chkAll').checked=ids.length===pend.length};
 f.addEventListener('change',e=>{if(e.target.id==='chkAll')$$('#modalBody input[name=ids]').forEach(i=>i.checked=e.target.checked);upd()});upd()}

/* ---------- adiantamento ---------- */
function advanceForm(id){const x=id?db.advances.find(a=>a.id===id):null;if(id&&!x)return;
 openModal(id?'Editar movimentação':'Registrar adiantamento',`<form class="formgrid"><div class="field full"><label>Tipo</label>${chips('type',[['recebido','💰 Adiantamento recebido'],['devolucao','↩️ Devolução de saldo']],x?.type||'recebido')}</div>
 <div class="field full"><label>Valor</label><div class="bigamount"><span>R$</span><input name="amount" inputmode="decimal" autofocus value="${fmtAmt(x?x.amount:db.settings.defaultAdvance)}"></div></div>
 <div class="field"><label>Data</label><input type="date" name="date" value="${esc(x?.date||TODAY())}"></div><div class="field"><label>Observação (opcional)</label><input name="note" maxlength="120" placeholder="Ex.: 2º adiantamento" value="${esc(x?.note||'')}"></div>${footer()}</form>`,f=>{
  const amount=parseAmt(f.amount.value),date=f.date.value;if(!amount||!isDate(date))return toast('Confira valor e data.');
  const v={id:x?.id||uid(),type:f.type.value==='devolucao'?'devolucao':'recebido',amount,date,note:f.note.value.trim(),createdAt:x?.createdAt||new Date().toISOString()};
  if(x)db.advances=db.advances.map(a=>a.id===x.id?v:a);else db.advances.push(v);if(!persist())return;closeModal(true);render();toast((v.type==='devolucao'?'Devolução registrada: ':'Adiantamento registrado: ')+money(amount))})}

/* ---------- categoria (modo edição) ---------- */
function categoryForm(id){const c=id?cat(id):null;if(id&&!c)return;const groups=[...new Set(db.categories.map(c=>c.group))].sort(gsort);
 openModal(c?'Editar categoria':'Nova categoria',`<form class="formgrid">
 <div class="field"><label>Categoria (grupo)</label><input name="group" list="grpList" required maxlength="40" value="${esc(c?.group||'')}"><datalist id="grpList">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
 <div class="field"><label>Tipo Despesa PMO (nome)</label><input name="name" required maxlength="60" value="${esc(c?.name||'')}"></div>
 <div class="field"><label>Código Harvest (Consultores)</label><input name="code" required maxlength="20" value="${esc(c?.code||'')}" style="text-transform:uppercase"></div>
 <div class="field"><label>Código para a descrição do Argo</label><input name="argoCode" maxlength="20" value="${esc(c?.argoCode||'')}" style="text-transform:uppercase"></div>
 <div class="field"><label>Despesa BI</label><input name="bi" maxlength="60" value="${esc(c?.bi||'')}"></div>
 <div class="field"><label>Tipo Argo</label><input name="argoType" maxlength="60" value="${esc(c?.argoType||'')}"></div>
 <div class="field"><label>Limite (R$) — vazio = sem limite</label><input name="limit" inputmode="decimal" value="${c?.limit?fmtAmt(c.limit):''}"></div>
 <div class="field"><label>Tipo de limite</label><select name="mode">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${(c?.mode||'none')===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field full"><label>Modelo da descrição do Argo</label><input name="template" maxlength="200" value="${esc(c?.template||GEN_TPL)}"><small class="help">Use: ${Object.entries(PH).map(([k,v])=>`<span class="code" title="${esc(v)}">{${k}}</span>`).join(' ')} · separe as partes com “ - ”. Partes sem informação são omitidas.</small><div class="argobox" id="tplPrev" style="margin-top:4px"></div></div>
 <div class="field full"><label>Regra especial</label><select name="rule">${Object.entries(RULES).map(([k,v])=>`<option value="${k}" ${(c?.rule||'none')===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field full"><label>Aplicação</label><textarea name="application" rows="2" maxlength="600">${esc(c?.application||'')}</textarea></div>
 <div class="field full"><label>Detalhamento da descrição do Argo</label><textarea name="detail" rows="3" maxlength="800">${esc(c?.detail||'')}</textarea></div>${footer()}</form>`,f=>{
  const g=k=>f[k].value.trim(),code=g('code').toUpperCase(),lr=g('limit'),limit=lr?parseAmt(lr):null;
  if(!g('group')||!g('name')||!code)return toast('Preencha grupo, nome e código Harvest.');if(lr&&!limit)return toast('Limite inválido (ex.: 45,00).');
  if(db.categories.some(z=>z.id!==c?.id&&z.code.toUpperCase()===code))return toast('Já existe uma categoria com esse código.');
  let mode=f.mode.value;if(!limit)mode='none';else if(mode==='none')mode='hard';
  const v={id:c?.id||uid(),code,argoCode:g('argoCode').toUpperCase(),group:g('group'),bi:g('bi'),name:g('name'),argoType:g('argoType'),limit,mode,rule:RULES[f.rule.value]?f.rule.value:'none',template:g('template')||GEN_TPL,application:g('application'),detail:g('detail')};
  if(c)Object.assign(c,v);else db.categories.push(v);if(!persist())return;closeModal(true);render();toast('Categoria salva ✓')});
 const fm=$('#modalBody form'),pv=()=>{const g=k=>fm[k].value.trim();$('#tplPrev').textContent='Exemplo: '+argoDesc({date:TODAY(),city:'Santa Maria/RS',qty:3,people:2,plate:'ABC1D23',meal:'Jantar',beneficiary:db.profile.name||'Nome do Profissional',note:'detalhamento',amount:4500},{name:g('name'),argoCode:g('argoCode').toUpperCase(),code:g('code'),rule:fm.rule.value,template:g('template')||GEN_TPL})};fm.addEventListener('input',pv);fm.addEventListener('change',pv);pv()}

/* ---------- perfil / parâmetros ---------- */
function profileForm(first){const p=db.profile;modalLocked=!!first;
 openModal(first?'Bem-vindo ao Pedro · Harvest 🌾':'Editar perfil',`<form class="formgrid">${first?'<p class="full help" style="margin:0">Este aplicativo é pessoal: seus dados ficam só neste aparelho. Informe seu nome para personalizar o Pedro.</p>':''}
 <div class="field full"><label>Seu nome completo</label><input name="name" required maxlength="80" autofocus value="${esc(p.name)}" placeholder="Ex.: Jorge Bonfante"></div>
 <div class="field"><label>Função no projeto</label><select name="role">${ROLES.map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
 <div class="field"><label>Cidade de origem/contratação</label><input name="homeCity" maxlength="80" value="${esc(p.homeCity)}" placeholder="Ex.: São Paulo/SP"></div>
 ${first?`<div class="field full"><label class="chk"><input type="checkbox" name="hasAdv" checked> Já recebi um adiantamento</label></div><div class="field"><label>Valor recebido</label><input name="advAmount" inputmode="decimal" value="${fmtAmt(db.settings.defaultAdvance)}"></div><div class="field"><label>Data</label><input type="date" name="advDate" value="${TODAY()}"></div>`:''}
 ${footer(first?'Começar 🚀':'Salvar')}</form>`,f=>{const name=f.name.value.trim();if(name.length<2)return toast('Informe seu nome.');
  const old=db.profile.name;db.profile={name,role:ROLES.includes(f.role.value)?f.role.value:'Outro',homeCity:f.homeCity.value.trim()};
  if(old&&old!==name)db.expenses.forEach(e=>{if(norm(e.beneficiary)===norm(old))e.beneficiary=name});
  if(first&&f.hasAdv.checked){const a=parseAmt(f.advAmount.value);if(!a||!isDate(f.advDate.value))return toast('Confira o valor e a data do adiantamento.');db.advances.push({id:uid(),type:'recebido',amount:a,date:f.advDate.value,note:'Adiantamento inicial',createdAt:new Date().toISOString()})}
  if(!persist())return;closeModal(true);navigate(page);toast(first?`Tudo pronto, ${name.split(' ')[0]}! 🌾`:'Perfil atualizado ✓')},first)}
function paramsForm(){const s=db.settings;openModal('Editar parâmetros',`<form class="formgrid"><div class="field"><label>Adiantamento padrão (R$)</label><input name="adv" inputmode="decimal" value="${fmtAmt(s.defaultAdvance)}"></div><div class="field"><label>Alerta para novo adiantamento (% consumido)</label><input name="pct" type="number" min="10" max="100" step="1" value="${s.alertPct}"></div>${footer()}</form>`,f=>{const a=parseAmt(f.adv.value),p=parseInt(f.pct.value,10);if(!a||!(p>=10&&p<=100))return toast('Confira os valores.');s.defaultAdvance=a;s.alertPct=p;if(!persist())return;closeModal(true);render();toast('Parâmetros salvos ✓')})}

/* ---------- exportação / backup ---------- */
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportCsv(){const l=page==='expenses'?filtered():[...db.expenses].sort(byDate);if(!l.length)return toast('Não há despesas para exportar.');
 const H=['Data','Cidade','Beneficiário','Categoria','Tipo Despesa PMO','Despesa BI','Tipo Argo','Código Harvest','Código descrição Argo','Quantidade','Refeição','Valor (R$)','Lançada no Argo','Status','Nº prestação','Data prestação','Descrição sugerida Argo','Detalhamento'];
 const rows=l.map(e=>{const c=cat(e.categoryId)||{};return[dateFmt(e.date),e.city,e.beneficiary,c.group,c.name,c.bi,c.argoType,c.code,c.argoCode,qtyRule(c)?e.qty:'',c.rule==='meal'?e.meal:'',fmtAmt(e.amount),e.argo?'Sim':'Não',e.status==='prestada'?'Prestada':'A prestar',e.reportId,dateFmt(e.reportDate),argoDesc(e),e.note]});
 download(`pedro_harvest_${norm(db.profile.name).replace(/[^a-z0-9]+/g,'_')||'despesas'}_${TODAY()}.csv`,'\ufeff'+[H,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast(`CSV exportado (${l.length} despesas).`)}
function validImport(v){if(!okShape(v))return false;const ids=new Set();for(const c of v.categories){if(!c||typeof c.id!=='string'||typeof c.name!=='string'||typeof c.code!=='string'||ids.has(c.id))return false;ids.add(c.id)}
 for(const e of v.expenses)if(!e||typeof e.id!=='string'||!isDate(e.date)||!Number.isSafeInteger(e.amount)||e.amount<=0)return false;
 for(const a of v.advances)if(!a||typeof a.id!=='string'||!isDate(a.date)||!Number.isSafeInteger(a.amount)||a.amount<=0)return false;return true}

/* ---------- ações ---------- */
function copyText(t,msg){const done=()=>toast(msg||('📋 Copiado: '+t),5000);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done).catch(()=>prompt('Copie a descrição:',t));else prompt('Copie a descrição:',t)}
document.addEventListener('click',e=>{
 const nb=e.target.closest('[data-page]');if(nb){navigate(nb.dataset.page);return}
 const g=e.target.closest('[data-goto]');if(g){e.preventDefault();if(g.dataset.status)F.status=g.dataset.status;navigate(g.dataset.goto);return}
 const af=e.target.closest('[data-af]');if(af){AF=af.dataset.af;renderArgo();return}
 const fs=e.target.closest('[data-fst]');if(fs){F.status=fs.dataset.fst;renderExpenses();return}
 const ch=e.target.closest('[data-chips] button');if(ch){const w=ch.parentNode,inp=w.closest('form').querySelector(`input[name="${w.dataset.chips}"]`);w.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===ch));inp.value=ch.dataset.v;inp.dispatchEvent(new Event('change',{bubbles:true}));return}
 const q=e.target.closest('[data-qd]');if(q){const d=new Date();d.setDate(d.getDate()+(+q.dataset.qd));const i=q.closest('.field').querySelector('input[type=date]');i.value=iso(d);i.dispatchEvent(new Event('change',{bubbles:true}));return}
 const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,a=b.dataset.act;
 switch(a){
  case 'cancel':closeModal();break;
  case 'newExp':expenseForm();break;case 'editExp':expenseForm(id);break;
  case 'delExp':{const x=db.expenses.find(z=>z.id===id);if(x&&confirm(`Excluir a despesa de ${money(x.amount)} (${cat(x.categoryId)?.name||''}, ${dateFmt(x.date)})?`)){db.expenses=db.expenses.filter(z=>z.id!==id);persist();render();toast('Despesa excluída.')}break}
  case 'toggle':{const x=db.expenses.find(z=>z.id===id);if(!x)break;if(x.status==='prestada'){x.status='pendente';x.reportId='';x.reportDate=''}else{x.status='prestada';x.reportDate=TODAY()}persist();render();toast(x.status==='prestada'?'Marcada como prestada no Argo ✓':'Voltou para “a prestar”.');break}
  case 'copy':{const x=db.expenses.find(z=>z.id===id);if(x)copyText(argoDesc(x));break}
  case 'copyTxt':copyText(b.dataset.txt);break;
  case 'copyAll':{const l=[...db.expenses].sort((a,b)=>a.date.localeCompare(b.date)).filter(e=>AF==='all'||(AF==='pend'?!e.argo:!!e.argo));if(l.length)copyText(l.map(argoDesc).join('\n'),l.length+' descrições copiadas ✓');break}
  case 'argoMark':{const x=db.expenses.find(z=>z.id===id);if(!x)break;x.argo=!x.argo;persist();render();toast(x.argo?'Marcada como lançada no Argo ✓':'Voltou para “a lançar”.');break}
  case 'batch':batchForm();break;
  case 'newAdv':advanceForm();break;case 'editAdv':advanceForm(id);break;
  case 'delAdv':{const x=db.advances.find(z=>z.id===id);if(x&&confirm(`Excluir a movimentação de ${money(x.amount)} de ${dateFmt(x.date)}?`)){db.advances=db.advances.filter(z=>z.id!==id);persist();render()}break}
  case 'editOn':if(confirm('Ativar o modo edição do glossário?\n\nAlterar códigos, limites e regras muda o que o Pedro valida nos próximos lançamentos.')){editMode=true;renderGlossary()}break;
  case 'editOff':editMode=false;renderGlossary();toast('Edição concluída 🔒');break;
  case 'newCat':categoryForm();break;case 'editCat':categoryForm(id);break;
  case 'delCat':{const n=db.expenses.filter(z=>z.categoryId===id).length;if(n)return toast(`Categoria usada em ${n} despesa(s): altere essas despesas antes de excluir.`);if(confirm('Excluir esta categoria?')){db.categories=db.categories.filter(z=>z.id!==id);persist();renderGlossary()}break}
  case 'resetCats':if(confirm('Restaurar as categorias padrão do glossário HV26?\n\nCategorias padrão editadas voltam ao original; categorias criadas por você são mantidas.')){const extra=db.categories.filter(c=>!DEFAULT_CATS.some(d=>d.id===c.id));db.categories=[...DEFAULT_CATS.map(c=>({...c})),...extra];persist();renderGlossary();toast('Glossário restaurado ✓')}break;
  case 'editProfile':profileForm(false);break;case 'editParams':paramsForm();break;
  case 'csv':exportCsv();break;
  case 'tpl':downloadTemplate();break;
  case 'upSheet':$('#importSheet').click();break;
  case 'backup':download(`pedro_harvest_backup_${TODAY()}.json`,JSON.stringify(db,null,2),'application/json');toast('Backup baixado. Guarde em local seguro.');break;
  case 'restore':$('#importJson').click();break;
  case 'wipe':if(confirm('Apagar TODOS os dados deste aparelho? Faça um backup antes.')&&confirm('Confirma a exclusão definitiva?')){db=fresh();persist();editMode=false;navigate('home');profileForm(true)}break;
 }});
document.addEventListener('change',e=>{if(e.target.id!=='importSheet')return;const f=e.target.files[0];e.target.value='';if(f)importSheet(f)});
document.addEventListener('change',async e=>{if(e.target.id!=='importJson')return;const file=e.target.files[0];e.target.value='';if(!file)return;
 try{if(file.size>20*1024*1024)throw Error('arquivo acima de 20 MB');const v=JSON.parse(await file.text());if(!validImport(v))throw Error('estrutura de backup inválida');
  if(!confirm(`Substituir os dados deste aparelho pelo backup de ${v.profile.name||'—'} (${v.expenses.length} despesas, ${v.advances.length} adiantamentos)?`))return;
  const old=db;db=v;if(!persist()){db=old;return}navigate('home');toast('Backup importado ✓')}catch(err){toast('Falha na importação: '+err.message)}});
$('#closeModal').onclick=()=>closeModal();$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.altKey&&(e.key==='n'||e.key==='N')&&!$('#modalBack').classList.contains('show')){e.preventDefault();expenseForm()}});
function applyTheme(){document.body.classList.toggle('dark',PREF.theme==='dark');$$('.themeLbl').forEach(l=>l.textContent=PREF.theme==='dark'?'☀️ Tema claro':'🌙 Tema escuro')}
$$('.themeSw').forEach(b=>b.onclick=()=>{PREF.theme=PREF.theme==='dark'?'light':'dark';savePref();applyTheme()});applyTheme();
navigate('home');
if(!db.profile.name)profileForm(true);
else if(new URLSearchParams(location.search).get('nova')==='1'){history.replaceState(null,'',location.pathname);setTimeout(()=>expenseForm(),200)}
window.__pedro={templateXlsx,readXlsx,prepareImport,check,parseAmt,natHoliday,totals,get db(){return db}};
})();

<script>
(()=>{'use strict';
let dp=null;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inst=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let msg='';const say=m=>{msg=m;const s=document.getElementById('pwaStatus');if(s)s.textContent=m};
const btns=()=>['installBtn','installBtn2'].map(i=>document.getElementById(i)).filter(Boolean);
const showBtns=()=>btns().forEach(b=>b.hidden=!(dp&&!inst()));
window.addEventListener('pedro-settings',()=>{say(msg||'Verificando…');showBtns()});
if(inst())say('📲 Pedro instalado como aplicativo. Funciona offline; seus dados ficam neste aparelho.');
else if(location.protocol==='file:')say('Aberto como arquivo local: publique em HTTPS para instalar como aplicativo.');
else if(ios)say('No iPhone/iPad: abra no Safari, toque em Compartilhar ⬆ e em “Adicionar à Tela de Início”.');
else say('Abra no Chrome/Edge e use “Instalar Pedro” ou o menu do navegador.');
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){
 addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(r=>{
  r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)say('Nova versão disponível: feche e abra o Pedro para atualizar.')})});
 }).catch(()=>say('Não foi possível ativar o modo offline. Confira se o sw.js foi publicado junto com o index.html.')));
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;showBtns()});
document.addEventListener('click',async e=>{const b=e.target.closest('#installBtn,#installBtn2');if(!b||!dp)return;const p=dp;dp=null;showBtns();try{await p.prompt();await p.userChoice}catch(_){}});
addEventListener('appinstalled',()=>{dp=null;showBtns();say('📲 Pedro instalado! Procure o ícone na tela inicial ou no menu Iniciar.')});
})();
